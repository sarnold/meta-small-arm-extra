header:
  version: 14
  includes:
    - kas/oe/base.yaml
    #- kas/oe/bbb.yaml
    - kas/oe/rpi64.yaml
    #- kas/oe/rockchip.yaml
    #- kas/oe/qemu.yaml
    - kas/oe/swu.yaml

local_conf_header:
  sysvinit: |
    IMAGE_INSTALL:append = " ifupdown iproute2"
    DISTRO_FEATURES:remove = "usrmerge"
    INIT_MANAGER = "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "sysvinit"
    VIRTUAL-RUNTIME_initscripts = "initscripts"
    VIRTUAL-RUNTIME_login_manager = "shadow-base"
