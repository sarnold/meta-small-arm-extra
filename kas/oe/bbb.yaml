header:
    version: 14
    includes:
        - kas/oe/arm.yaml
        - kas/oe/ti.yaml
        #- kas/vboot.yaml

local_conf_header:
    bbb-bits: |
        PREFERRED_PROVIDER_u-boot = "u-boot-ti-staging"
        PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-ti-staging"

        # remove default kernel image to make packagegroup-core-boot happy
        MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "kernel-image-zimage"

        IMAGE_BOOT_FILES:append = " fitImage;image.ub uEnv.txt"
        IMAGE_BOOT_FILES:remove = "${UBOOT_EXTLINUX_BOOT_FILES}"
        IMAGE_BOOT_FILES:remove = "zImage "
