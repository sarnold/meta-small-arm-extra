header:
    version: 14
    includes:
        - kas/oe/arm.yaml

# default is BPi bananapi-m1-plus
machine: bananapi-m1-plus

repos:
    meta-sunxi:
        url: "https://github.com/linux-sunxi/meta-sunxi.git"
        branch: scarthgap
        path: "layers/meta-sunxi"

local_conf_header:
    sunxi: |
        BBMASK += "u-boot-ti-staging.*\.bbappend"
        BBMASK += "linux-ti-staging.*\.bbappend"
        BBMASK += "rpi-u-boot-scr.*\.bbappend"
        IMAGE_INSTALL:append = " lirc ntp-utils zram"
        # IMAGE_INSTALL:append = " v4l-utils"
