header:
    version: 14

# make the default rpi3-64
machine: raspberrypi3-64
# 64bit kernel for raspberrypi3-64 can be very big

repos:
    meta-raspberrypi:
        url: "https://github.com/agherzan/meta-raspberrypi"
        branch: scarthgap
        path: "layers/meta-raspberrypi"
        patches:
            p1:
                repo: meta-raspberrypi
                path: ../meta-small-arm-extra/patches/0001-meta-rpi-move-uboot-load-addresses-to-machine-conf.patch


local_conf_header:
    rpi-specific: |
        BBMASK += "u-boot-ti-staging.*\.bbappend"
        BBMASK += "linux-ti-staging.*\.bbappend"
        BBMASK += "linux-mainline.*\.bbappend"
        #BBMASK += "rpi-u-boot-scr.*\.bbappend"
        #BBMASK += "libubootenv.*\.bbappend"
        LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
        ENABLE_I2C = "1"
        ENABLE_UART = "1"
        PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
        PREFERRED_PROVIDER_u-boot-fw-utils = "libubootenv"
        ## for serial console via GPIO pins on rp3 and rpi0-W
        SERIAL_CONSOLES = "115200;ttyAMA0"
        RPI_EXTRA_CONFIG = "dtoverlay=pi3-disable-bt"
        RPI_USE_U_BOOT = "1"
        #KBUILD_DEFCONFIG:raspberrypi3 = "bcmrpi3_defconfig"
        #UBOOT_MACHINE:raspberrypi3 = "rpi_3_defconfig"
    rpi-overrides: |
        # set dtb for rpi3-64
        #FIT_CONF_DEFAULT_DTB = "bcm2710-rpi-3-b.dtb"
        # disable for rpi
        #FIT_KERNEL_COMP_ALG = "none"
        IMAGE_FSTYPES:remove = " ext3 rpi-sdimg wic.bz2"
        #INITRAMFS_IMAGE = ""
        # adjusted for fitImage
        #UBOOT_DTB_LOADADDRESS = "0x03000000"
        #UBOOT_DTBO_LOADADDRESS = ""
        UBOOT_LOADADDRESS = "0x00080000"
        UBOOT_ENTRYPOINT = "0x00080000"
        #KERNEL_BOOTCMD = "bootm"
