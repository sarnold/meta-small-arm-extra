header:
  version: 14

local_conf_header:
    vboot: |
        #
        # Verified Boot Settings
        #

        UBOOT_SIGN_ENABLE = "1"
        UBOOT_SIGN_KEYDIR = "${TOPDIR}/../dev-keys"
        UBOOT_SIGN_KEYNAME = "dev"
        UBOOT_MKIMAGE_DTCOPTS = "-I dts -O dtb"
        FIT_GENERATE_KEYS = "1"
        FIT_SIGN_INDIVIDUAL = "0"
