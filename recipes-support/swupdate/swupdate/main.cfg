globals : {
    verbose = true;
    loglevel = 5;
    syslog = true;
    /* public-key-file = "test.pem";*/
    mtd-blacklist = "0 1 2 3 4 5 6";
};

logcolors : {
    error = "red:bold";
    trace = "green:normal";
    debug = "magenta:normal";
    warning = "yellow:underline";
};

download : {
    /* authentication = "user:password";*/
    retries = 3;
    timeout = 1800;
};
